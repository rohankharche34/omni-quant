version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/omniquant
      - MLFLOW_TRACKING_URI=http://mlflow:5001
    depends_on:
      - redis
      - db
      - mlflow
    volumes:
      - .:/app

  worker:
    build: .
    command: python -m celery -A celery_app.celery worker --loglevel=info
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/omniquant
      - MLFLOW_TRACKING_URI=http://mlflow:5001
    depends_on:
      - redis
      - db
      - mlflow
    volumes:
      - .:/app

  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=omniquant
    ports:
      - "5432:5432"

  mlflow:
    build: .
    command: mlflow server --host 0.0.0.0 --port 5001 --backend-store-uri postgresql://postgres:postgres@db:5432/omniquant --default-artifact-root ./mlruns
    ports:
      - "5001:5001"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/omniquant
    volumes:
      - .:/app

  beat:
    build: .
    command: python -m celery -A celery_app.celery beat --loglevel=info
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/omniquant
    depends_on:
      - redis
      - db
    volumes:
      - .:/app

  flower:
    build: .
    command: celery -A celery_app.celery flower --port=5555
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
      - worker
    volumes:
      - .:/app
